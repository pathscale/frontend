# rustc's frontend, as one crate.
#
# Upstream ships this as sixty-odd crates. Published, each name is permanent and each is a
# dependency somebody has to take, so they are modules of this one instead. Three crates exist
# where sixty-eight did, and the other two exist only because the language insists: a proc-macro
# crate compiles separately for the host and cannot be merged into a normal one, and it cannot
# export a normal item for a normal crate to use.

[package]
name = "frontend"
version = "0.4.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "rustc's frontend with no LLVM and no std: parsing through MIR, as a library"
repository = "https://github.com/pathscale/frontend"
readme = "README.md"
publish = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "frontend-facts"
path = "src/bin/frontend_facts.rs"

# Runs with or without the `parallel` feature; without it every setting is the serial path.
[[example]]
name = "parallel_timing"

[workspace]
# **Load-bearing for `no_std`.** Without it cargo unifies features across the host and target
# graphs, so `frontend_macros` - a proc macro, which may perfectly well use `std` - pulled
# `indexmap`'s default features, and `indexmap/std` arrived in `frontend`'s own build. The symptom
# is not a feature complaint: it is a duplicate lang item first defined in crate std (which
# indexmap depends on) in a `no_std` binary, whose own `#[panic_handler]` collides with std's. A
# resolver of 2 or later keeps the two graphs apart.
resolver = "3"
members = ["frontend_macros", "frontend_diag_template", "frontend_arena"]
exclude = ["link-probe"]

[features]
# `nightly` gates the derives that come from the proc-macro crate. Upstream keeps it optional so
# `rustc_abi` and `rustc_index` can build on stable for rust-analyzer; that split is preserved
# rather than flattened, because it is the only thing making those modules usable off nightly.
default = ["nightly", "rustc"]
nightly = ["dep:rustc_macros"]
# `rustc_pattern_analysis` gates its rustc-facing modules behind this, so that upstream can use
# the crate standalone for a different pattern-matching client. Here the rustc-facing side is the
# only side there is, which is why it defaults on.
rustc = []
# Keep the compiled-in `CFG_VERSION` and refuse crate metadata from any other
# vintage. Off by default: a sysroot is optional, and when one is present the
# session claims the version that sysroot actually carries. Parsing compatibility
# is an edition range, not a pin to one bootstrap stamp.
force_pinned_sysroot = []
# Syntax-level diagnostics ported from rust-analyzer, in `frontend_facts::diagnostics`. Off by
# default: nothing else in the crate calls them, and a caller who does not want them does not
# compile them.
diagnostics = []
# Run a parallel session's stages (`rustc_data_structures::sync::stages`) on nagoya's pool. Off
# by default, and the default build is the serial compiler exactly as it was, with no `nagoya`
# and no `std` in its graph.
#
# **Why it is a feature and not a dependency everyone takes.** nagoya's pool needs `std` (its
# `Runtime` owns the worker threads, and `std` is what starts them and parks them), and a
# library that depends on a `std`-using crate puts `std` into every binary that links it. A
# `no_std` binary with its own `#[panic_handler]` then fails to link with a duplicate lang item,
# first defined in crate std: the failure the `[workspace]` note below describes for
# `indexmap/std`. `link-probe` is exactly such a binary and depends on this crate with default
# features, so it keeps building and keeps proving the default graph has no `std`. The
# `frontend-facts` binary is a `std` program already and can take the feature.
#
# frontend creates no thread with or without it: the pool's threads are nagoya's (or the pool a
# program hands over through `sync::set_parallel_executor`).
parallel = ["dep:nagoya"]

[dependencies]
# nagoya's pool, for `parallel` only. `Runtime::builder().stack_size`, `Executor::{submit, pool}`
# and `block_on` are what this crate calls. Default features, because `std` is the point: see the
# `parallel` feature above.
# Moves to the crates.io release (`^0.1.14`) once nagoya publishes `Runtime::builder`.
nagoya = { git = "https://github.com/pathscale/nagoya", branch = "feat/stack-size", optional = true }
# The two crates that could not be merged. `rustc_macros` is the historical name and the source
# still says `rustc_macros::`, so it is aliased rather than renamed across ten thousand sites.
rustc_macros = { package = "frontend_macros", path = "frontend_macros", version = "0.2.0", optional = true }
frontend_diag_template = { path = "frontend_diag_template", version = "0.1.1" }
# Not a module, deliberately. See `frontend_arena/Cargo.toml`.
frontend_arena = { path = "frontend_arena", version = "0.2.0" }

arrayvec = { version = "^0.7.8", default-features = false }
bitflags = "2.9.1"
cfg-if = { version = "1.0.0", default-features = false }
blake3 = { version = "1.8.2", default-features = false }
derive-where = "1.6.1"
derive_setters = "0.1.6"
either = { version = "^1.18.0", default-features = false }
ekostd = { version = "0.2.2", features = ["serde"] }
hashbrown = { version = "0.17.0", default-features = false, features = ["default-hasher"] }
indexmap = { version = "2.14.0", default-features = false }
itertools = { version = "^0.15.0", default-features = false, features = ["use_alloc"] }
itoa = "^1.0.18"
libc = { version = "^0.2.189", default-features = false }
libm = "^0.2.16"
log = { version = "0.4", default-features = false }
md5 = { package = "md-5", version = "0.10.0", default-features = false }
memchr = { version = "2.7.6", default-features = false, features = ["alloc"] }
object = { version = "0.39.1", default-features = false, features = ["read_core", "archive", "elf", "macho", "pe", "xcoff", "unaligned"] }
parking_lot = { package = "parking_lot_lite_hack", version = "^0.12.7", default-features = false }
rand = { version = "0.9.0", default-features = false }
rand_xoshiro = "0.7.0"
rustc-demangle = "0.1.28"
rustc_apfloat = "0.2.3"
rustc-hash = { version = "2.0.0", default-features = false }
rustc-literal-escaper = "0.0.8"
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive", "rc"] }
serde_derive = "1.0.219"
serde_json = { version = "1.0.59", default-features = false, features = ["alloc"] }
serde_path_to_error = "0.1.17"
sha1 = { version = "0.10.0", default-features = false }
sha2 = { version = "0.10.1", default-features = false }
smallvec = { version = "1.8.1", features = ["union"] }
thin-vec = { version = "0.2.19", default-features = false }
tracing = { version = "^0.1.44", default-features = false, features = ["attributes"] }
tracing-core = { version = "0.1.34", default-features = false }
# Held below 1.0.25, which moved to Unicode 18 while `unicode-properties` 0.1.4 and
# `unicode-width` 0.2.2 are still on 17. `rustc_lexer` and `rustc_parse` assert the versions
# agree at compile time, so an unbounded `1.0.22` let every fresh resolution fail to build.
# Lift the bound when the other two move to 18.
unicode-ident = ">=1.0.22, <1.0.25"
unicode-normalization = { version = "0.1.25", default-features = false }
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
unicode-security = "0.1.0"
unicode-width = "0.2.2"

# The vendored upstream unit tests, at the versions upstream tested with. They link only into the
# `cargo test` harness, which brings `std` itself; the library build never sees them.
[dev-dependencies]
# The timing example sizes its own nagoya pool (`--pool N`) and hands it over with
# `sync::set_parallel_executor`, to measure scaling at pool sizes other than the default.
nagoya = { git = "https://github.com/pathscale/nagoya", branch = "feat/stack-size" }
# The pool's idle policy for `--tuning` (`Builder::tuning` takes fanout's `Tuning`, which nagoya
# does not re-export).
ps-st3 = { version = "^0.6", default-features = false, features = ["fanout"] }
# `rustc_lexer`'s snapshot tests.
expect-test = "1.4.0"
# `odht`'s property tests.
quickcheck = "1"
# `odht`'s property tests compare against an `FxHashMap`, which quickcheck can only generate as a
# `std` `HashMap`. The `rustc-hash` above is built without `std` and so has no such alias; this
# is the 1.1 that upstream odht used, renamed so it cannot be mistaken for the real dependency.
rustc_hash_std = { package = "rustc-hash", version = "1.1.0" }

[profile.release]
debug = false
incremental = false
