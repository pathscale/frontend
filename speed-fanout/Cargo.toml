[package]
name = "speed-fanout"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "A caller-side driver that runs frontend's reading-only entry points on several threads"
publish = false

# Its own workspace, so it builds standalone from this directory. The parent lists it under
# `exclude`: the driver is a caller of frontend, not part of it, and frontend spawns nothing.
[workspace]

[dependencies]
frontend = { path = "..", features = ["diagnostics"] }
# The threads and the locks. Library name `eko`.
ekostd = "^0.2"
# The fanout pool, library name `st3`. Only `fanout`: the crate's own OS hosts (`host`,
# `atomic-host`) are left off, and `src/host.rs` supplies one over `eko`'s Mutex and Condvar.
# The pool's own queues still pull `crossbeam-utils` and `crossbeam-queue` underneath; nothing
# here names them. The crates.io 0.6.2 source is identical to pathscale/st3's master.
ps-st3 = { version = "^0.6", default-features = false, features = ["fanout"] }
