name: Publish

# A version bump on master is the release trigger. Each crate is published in
# dependency order; a version already on crates.io is skipped, so a push that
# bumps nothing uploads nothing.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - frontend_arena/Cargo.toml
      - frontend_macros/Cargo.toml
      - frontend_diag_template/Cargo.toml
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          for crate in frontend_arena frontend_macros frontend_diag_template frontend; do
            version="$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            published="$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$crate/$version" | jq -r '.version.num // empty')"
            if [ "$published" = "$version" ]; then
              echo "$crate $version already on crates.io"
              continue
            fi
            cargo publish -p "$crate"
          done
